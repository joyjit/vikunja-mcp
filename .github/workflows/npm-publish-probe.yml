# Manual-only: prove GitHub Actions can publish to npm via Trusted Publishing (OIDC).
# Publishes a tiny bump of @joyjit/npm-scope-probe (not vikunja-mcp).
# No long-lived NPM_TOKEN — requires Trusted Publisher on npm for this package + workflow.
name: NPM Publish Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@joyjit'

      - name: Publish probe package bump
        run: |
          # Do not write _authToken / NODE_AUTH_TOKEN — npm OIDC handles publish.
          {
            echo '@joyjit:registry=https://registry.npmjs.org/'
          } > "$NPM_CONFIG_USERCONFIG"

          NPM_VER=$(npm --version)
          echo "npm ${NPM_VER}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(
                "npm >= 11.5.1 required for Trusted Publishing, got",
                process.argv[1]
              );
              process.exit(1);
            }
          ' "$NPM_VER"

          mkdir probe && cd probe
          CURRENT=$(npm view @joyjit/npm-scope-probe version)
          NEXT=$(node -e "const v=process.argv[1].split('.').map(Number); v[2]+=1; console.log(v.join('.'))" "$CURRENT")
          echo "bump ${CURRENT} -> ${NEXT}"

          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            fs.writeFileSync(
              "package.json",
              JSON.stringify(
                {
                  name: "@joyjit/npm-scope-probe",
                  version,
                  description: "CI publish probe only — do not use",
                  license: "MIT",
                  repository: {
                    type: "git",
                    url: "git+https://github.com/joyjit/vikunja-mcp.git",
                  },
                  publishConfig: { access: "public" },
                },
                null,
                2
              ) + "\n"
            );
            fs.writeFileSync("README.md", "CI publish probe only.\n");
          ' "$NEXT"

          npm publish --access public
          echo -n "registry now: "
          npm view @joyjit/npm-scope-probe version

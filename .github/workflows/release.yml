name: Release

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

# Prefer `main` when actions/checkout runs `git init` (silences master-branch hint).
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          # No registry-url: setup-node would inject NODE_AUTH_TOKEN /
          # _authToken and block npm's OIDC Trusted Publishing path.
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to NPM
        run: |
          # Trusted Publishing (OIDC) — no long-lived NPM_TOKEN.
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          unset NPM_CONFIG_USERCONFIG
          rm -f "$HOME/.npmrc" "${RUNNER_TEMP:-/tmp}/.npmrc"

          NPM_VER=$(npm --version)
          echo "npm ${NPM_VER}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(
                "npm >= 11.5.1 required for Trusted Publishing, got",
                process.argv[1]
              );
              process.exit(1);
            }
          ' "$NPM_VER"

          echo "oidc_url_set=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          npm publish --access public

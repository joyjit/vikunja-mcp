name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays

permissions:
  security-events: write
  contents: read

# Prefer `main` when actions/checkout runs `git init` (silences master-branch hint).
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      # Audit what ships in the published package. Dev-only findings (jest /
      # handlebars / nyc) are tracked on the weekly schedule below; a fresh
      # handlebars patch can also be blocked by min-release-age=7 for days.
      - name: Run npm audit (production)
        run: npm audit --omit=dev

      - name: Run npm audit (full, non-blocking)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: npm audit

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
